    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Languni",
      "url": "https://languni.dev",

      "operatingSystem": "Web",
      "offers": [
        {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "name": "Free Plan"
        },
        {
          "@type": "Offer",
          "price": "6.99",
          "priceCurrency": "USD",
          "name": "Premium Plan",
          "billingIncrement": "month"
        }
      ],
      "inLanguage": ["en", "fr", "es"],
      "featureList": [
        "Interactive YouTube video lessons",
        "Click-to-define vocabulary",
        "Save and review vocabulary",
        "English, Spanish, and French learning"
      ]
    }
    </script>
